services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: triagem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triagem_local}
      POSTGRES_DB: triagem
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagem -d triagem"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://triagem:${POSTGRES_PASSWORD:-triagem_local}@banco:5432/triagem
      DADOS_TRIAGEM: /app/dados
    volumes:
      - ${DADOS_LOCAL:-./dados_exemplo}:/app/dados:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_banco:
